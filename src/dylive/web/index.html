<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>抖音直播切片</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">DY</span>
      <span class="brand-name">抖音直播切片</span>
    </div>
    <span class="tag">DeepSeek 导演 · 全自动</span>
  </header>

  <main id="app">
    <section class="hero" id="hero">
      <h1>贴个链接，自动剪出高能切片</h1>
      <p class="sub">自动看直播 · 识别高能 · AI 判断最优特效 · 剪成竖屏成片</p>
      <div class="composer">
        <input id="url" type="text" placeholder="粘贴直播链接，如 https://live.douyin.com/…" autocomplete="off" spellcheck="false" />
        <button id="btn-start">开始切片</button>
      </div>
      <div class="hint">首次使用请先在终端执行 <code>dylive login</code> 扫码登录抖音</div>
    </section>

    <section class="running" id="running" hidden>
      <div class="spinner"></div>
      <h2 id="run-title">正在等待主播开播…</h2>
      <p class="sub" id="run-sub">开播后自动录制、转写、检测高能、剪辑</p>
      <div class="log" id="log"></div>
    </section>

    <section class="results" id="results" hidden>
      <h2>切片结果</h2>
      <p class="sub" id="room-label"></p>
      <div class="grid" id="grid"></div>
    </section>

    <section class="empty" id="empty" hidden>
      <h2>还没有切片</h2>
      <p class="sub">贴上方的直播链接，点「开始切片」就会自动产出</p>
    </section>
  </main>

  <div class="backdrop" id="backdrop" hidden>
    <div class="preview-box">
      <video id="preview" controls playsinline></video>
      <button class="close" id="btn-close" aria-label="关闭">×</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
